
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickToolNest — Admin Control Center</title>
<style>
:root{--navy:#10213b;--blue:#1479f8;--bg:#f4f7fc;--ink:#172640;--muted:#71809a;--line:#e1e9f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px/1.5 system-ui,Arial;color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:650;background:var(--blue);color:#fff}
input{width:100%;padding:12px;border:1px solid #d6dfed;border-radius:9px}
label{display:block;font-weight:650;margin:14px 0 6px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.login-wrap{max-width:430px;margin:8vh auto;padding:20px}
.login-card,.panel,.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 4px 20px #17365d08}
.brand{font-size:21px;font-weight:800;margin-bottom:24px}
.logo{display:inline-grid;place-items:center;background:linear-gradient(135deg,#1687ff,#35d4ce);color:white;width:40px;height:40px;border-radius:12px;margin-right:8px}
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:230px;background:var(--navy);color:white;padding:20px 13px}
.nav{display:block;width:100%;text-align:left;background:transparent;color:#d8e5fa;margin:4px 0}
.nav:hover,.nav.active{background:#1878ed}
.main{margin-left:230px}
.topbar{background:white;border-bottom:1px solid var(--line);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.content{padding:25px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.metric strong{display:block;font-size:28px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:18px}
.panel h2{font-size:17px;margin-top:0}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.notice{padding:12px;background:#eef5ff;border-radius:9px;margin-top:12px;white-space:pre-wrap}
@media(max-width:800px){.sidebar{position:static;width:100%;display:flex;flex-wrap:wrap;padding:10px}.brand{width:100%;margin:5px}.nav{width:auto;display:inline-block}.main{margin:0}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.content{padding:14px}.topbar{padding:12px;flex-wrap:wrap}}
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="logo">✦</span>QuickToolNest<br><small class="muted">Admin Control Center</small></div>
    <h2>Welcome back</h2>
    <p class="muted">Sign in to manage your website.</p>
    <label for="apiUrl">Cloudflare Worker API URL</label>
    <input id="apiUrl" placeholder="https://your-worker.workers.dev">
    <label for="adminPassword">Admin password</label>
    <input id="adminPassword" type="password" autocomplete="current-password">
    <button id="loginBtn" style="width:100%;margin-top:18px">Sign in to dashboard</button>
    <div id="loginMsg" class="notice hidden"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand">✦ QuickToolNest</div>
    <button class="nav active" data-page="dashboard">⌂ Dashboard</button>
    <button class="nav" data-page="tools">⚒ Tools Management</button>
    <button class="nav" data-page="categories">▦ Categories</button>
    <button class="nav" data-page="pages">▤ Pages Management</button>
    <button class="nav" data-page="ads">◈ Ads & Monetization</button>
    <button class="nav" data-page="analytics">▥ Analytics & Reports</button>
    <button class="nav" data-page="settings">⚙ Website Settings</button>
    <button class="nav" data-page="account">♙ Admin Account</button>
  </aside>
  <main class="main">
    <header class="topbar">
      <strong id="pageTitle">Dashboard</strong>
      <div>
        <button id="viewSite">View Website ↗</button>
        <button id="logoutBtn" style="background:#e9eef8;color:#243650">Logout</button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
